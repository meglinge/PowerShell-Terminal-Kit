# PowerShell Terminal Kit — psmux configuration

# Keep every pane on native PowerShell 7. The installer guarantees pwsh.exe.
set -g default-shell pwsh.exe
set -g default-terminal "xterm-256color"

# Ctrl+A is ergonomic and familiar. Press Ctrl+A twice to send a literal Ctrl+A.
set -g prefix C-a
unbind-key C-b

# Sessions, windows and scrollback.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g display-panes-time 2000
set -g mode-keys vi

# Native TUI compatibility: Neovim block selection, Amp input and true-color apps.
set -g mouse on
set -g mouse-selection off
set -g scroll-enter-copy-mode on
set -g focus-events on
set -g set-clipboard on
set -g paste-detection off
set -g allow-predictions on
set -g prediction-dimming off
set -g bold-is-bright on
set -g cursor-style bar
set -g cursor-blink on

# Stable labels: PowerShell otherwise replaces pane titles with its current path.
set -g allow-set-title off
set -g pane-border-status off

# Splits and new windows inherit the active pane's working directory.
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# Prefix navigation does not steal Neovim, Amp or PSReadLine root keys.
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R
bind-key -r H resize-pane -L 3
bind-key -r J resize-pane -D 2
bind-key -r K resize-pane -U 2
bind-key -r L resize-pane -R 3
bind-key Tab last-window
bind-key r source-file ~/.psmux.conf

# Tokyo Night, matching Windows Terminal and Neovim.
set -g status-position bottom
set -g status-interval 2
set -g status-justify left
set -g status-style "fg=#a9b1d6,bg=#1a1b26"
set -g status-left-style "fg=#7aa2f7,bg=#1a1b26,bold"
set -g status-right-style "fg=#7dcfff,bg=#1a1b26"
set -g window-status-style "fg=#565f89,bg=#1a1b26"
set -g window-status-current-style "fg=#1a1b26,bg=#7aa2f7,bold"
set -g message-style "fg=#1a1b26,bg=#e0af68,bold"
set -g mode-style "fg=#1a1b26,bg=#bb9af7"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-hover-style "fg=#7dcfff"
set -g status-left " 󰆍 #S "
set -g status-right " #H | %H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
